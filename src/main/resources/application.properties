# Spice Store - Production Configuration

spring.application.name=spicestore

# Default to local profile, override via environment variables for production
spring.profiles.active=local

app.baseUrl = ${APP_BASE_URL:http://localhost:4200}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spice_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=5000
spring.jpa.hibernate.ddl-auto= ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# App Properties
app.jwtCookieName= token
app.jwtSecret=${APP_JWT_SECRET:NqKQM0U7cS0eW8/oa1fs1Ro0cELYvchi3AJy8V8MpMI=}
app.jwtExpirationMs= 86400000

# Logging
#logging.level.org.springframework.security=DEBUG
#logging.level.com.mindoot=DEBUG

# Actuator
management.endpoints.web.exposure.include=*
# Mail server connectivity is not required for the app to be healthy; without this,
# a slow/unreachable SMTP host drags /actuator/health to DOWN and blocks for ~2 minutes.
management.health.mail.enabled=false
info.app.name=Spice Store API
info.app.version=1.0.0

# Email properties
# These spring.mail.* values are no longer used to actually send mail (see
# resend.api.key below) - kept only because NotificationServiceImpl still takes
# a JavaMailSender in its constructor, and Spring Boot only creates that bean
# when spring.mail.host is set. All real sending goes through Resend's HTTPS
# API now: Railway (and most PaaS hosts) block outbound SMTP ports (587/465/25),
# which made every OTP/order email time out even with correct SMTP credentials.
spring.mail.default-encoding=UTF-8
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Resend (https://resend.com) - transactional email over HTTPS, used by
# EmailServiceImpl for every outgoing email (OTP, order confirmations, admin
# notifications, invoices). Get an API key from the Resend dashboard.
resend.api.key=${RESEND_API_KEY:}

# Twilio - phone OTP login SMS (SmsService). From Twilio Console: Account SID,
# Auth Token, and a Twilio phone number capable of sending SMS.
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

app.redirect.url=${APP_REDIRECT_URL:http://localhost:4200}

# Google OAuth (Sign up/in with Google) - client ID is public, safe to default here
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:779918118408-1rukfh8j7g7qqi36tmu63bqrcs4d58ba.apps.googleusercontent.com}

# Local file storage
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

# Razorpay
razorpay.api.key = ${RAZORPAY_API_KEY}
razorpay.api.secret = ${RAZORPAY_API_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# GST Configuration
gst.enabled=${GST_ENABLED:true}
gst.cgst.rate=${GST_CGST_RATE:9}
gst.sgst.rate=${GST_SGST_RATE:9}

# Must be either Resend's sandbox address (onboarding@resend.dev - only
# deliverable to the Resend account's own verified email, fine for testing)
# or an address on a domain verified in the Resend dashboard.
app.mail.from = ${APP_MAIL_FROM:Spice Store <onboarding@resend.dev>}

JAVA_OPTS=-XX:ReservedCodeCacheSize=128M
