# Spice Store - Production Configuration

spring.application.name=spicestore

# Default to local profile, override via environment variables for production
spring.profiles.active=local

app.baseUrl = ${APP_BASE_URL:http://localhost:4200}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spice_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL8Dialect
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=5000
spring.jpa.hibernate.ddl-auto= ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# App Properties
app.jwtCookieName= token
app.jwtSecret=${APP_JWT_SECRET:NqKQM0U7cS0eW8/oa1fs1Ro0cELYvchi3AJy8V8MpMI=}
app.jwtExpirationMs= 86400000

# Logging
#logging.level.org.springframework.security=DEBUG
#logging.level.com.mindoot=DEBUG

# Actuator
management.endpoints.web.exposure.include=*
# Mail server connectivity is not required for the app to be healthy; without this,
# a slow/unreachable SMTP host drags /actuator/health to DOWN and blocks for ~2 minutes.
management.health.mail.enabled=false
info.app.name=Spice Store API
info.app.version=1.0.0

# Email properties
spring.mail.default-encoding=UTF-8
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.starttls.required=true

app.redirect.url=${APP_REDIRECT_URL:http://localhost:4200}

# Local file storage
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}

# Razorpay
razorpay.api.key = ${RAZORPAY_API_KEY}
razorpay.api.secret = ${RAZORPAY_API_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# GST Configuration
gst.enabled=${GST_ENABLED:true}
gst.cgst.rate=${GST_CGST_RATE:9}
gst.sgst.rate=${GST_SGST_RATE:9}

app.mail.from = ${APP_MAIL_FROM:Spice Store <noreply@yourstore.com>}

JAVA_OPTS=-XX:ReservedCodeCacheSize=128M
