spring.application.name=spicestore
habitat=local

app.baseUrl = http://localhost:4200

spring.datasource.url= jdbc:mysql://localhost:3306/spice_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto= update

#spring.jpa.hibernate.ddl-auto= update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# App Properties
app.jwtCookieName= token
app.jwtSecret= ${APP_JWT_SECRET:l5gp+va7gsAChPO6jG+y9cMQgxcH3IPBzDLj+4Mq+Js=}
app.jwtExpirationMs= 86400000

# Actuator
management.endpoints.web.exposure.include=*
info.app.name=Spice Store API
info.app.version=1.0.0

# Email properties
spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:local-dev@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.starttls.required=true

app.redirect.url=http://localhost:4200

# Local file storage
app.upload.dir=uploads
app.upload.max-file-size=5MB

# Razorpay
razorpay.api.key = ${RAZORPAY_API_KEY:rzp_test_yourkey}
razorpay.api.secret = ${RAZORPAY_API_SECRET:yoursecret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:yourwebhooksecret}

# GST Configuration
gst.enabled=true
gst.cgst.rate=9
gst.sgst.rate=9

app.mail.from = Spice Store <noreply@yourstore.com>
